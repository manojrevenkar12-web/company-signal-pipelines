version: 2

models:
  - name: companies
    description: The golden record, one row per resolved company; each field comes from the source that won it.
    columns:
      - name: entity_id
        description: Stable company id, derived from the company's source records.
        data_tests: [unique, not_null]
      - name: is_customer
        description: The company is a corporate customer from the CRM.
      - name: source_records
        description: How many source records (vendor ids, register entries, job domains, CRM rows) were merged.
      - name: name
        description: Current name; the register beats the vendor because the vendor keeps old names after a rebrand.
      - name: name_source
        description: The feed the name came from.
      - name: domain
        description: Normalised web domain (no scheme, no www, no path).
      - name: city
        description: Seat of the company.
      - name: country
        description: ISO country code.
      - name: founded_year
        description: Year of founding as the vendor reports it.
      - name: headcount
        description: Latest vendor headcount; noisy by about a fifth.
      - name: status
        description: active, acquired or shut_down. A terminal status from any trusted source beats active.
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "acquired", "shut_down"]
      - name: status_source
        description: The feed whose evidence set the status.
      - name: status_observed
        description: The day that evidence was loaded.
  - name: company_signals
    description: Dated funding, acquisition, shutdown and headcount signals, one per company, kind and window.
    columns:
      - name: event_id
        description: Stable id of the signal.
        data_tests: [unique, not_null]
      - name: entity_id
        description: The company.
        data_tests:
          - relationships:
              arguments:
                to: ref('companies')
                field: entity_id
      - name: kind
        description: funding, acquisition, shutdown or headcount.
        data_tests:
          - accepted_values:
              arguments:
                values: ["funding", "acquisition", "shutdown", "headcount"]
      - name: event_date
        description: The earliest date credible evidence states (a contract date, an announcement), not the load date.
      - name: source_count
        description: How many feeds back the signal.
      - name: first_seen
        description: The day the pipeline first had evidence.
      - name: days_until_known
        description: first_seen minus event_date; how late the market told us.
  - name: relationships
    description: Corporate-startup pairs with their strongest accepted relationship label.
    columns:
      - name: relationship
        description: mention, partnership, poc, implementation, investment or acquisition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["mention", "partnership", "poc", "implementation", "investment", "acquisition"]
      - name: articles
        description: Articles behind the pair.
    data_tests:
      - dbt_utils_free_unique_pair
  - name: recommendable_startups
    description: Startups the scouting product may recommend; never acquired or shut down.
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
  - name: feed_health
    description: Loads, quarantines, backfills, kept rows and alerts per feed.
    columns:
      - name: feed
        data_tests: [unique, not_null]
      - name: redelivered_share
        description: Share of delivered rows that were already in raw (absorbed by idempotent keys).
  - name: classification_cost
    description: What classifying articles cost, by the tier that decided.
    columns:
      - name: decided_by
        description: rule, cheap, expensive, review (waiting for a person) or person.
        data_tests: [unique]
