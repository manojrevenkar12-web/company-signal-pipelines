# Held-out data market: more typos, rebrands, ambiguous and German wording, a different outage plan. Run once. Only world/ and evals/ read this file.
name = "heldout"
seed = 977
startups = 2400
corporates = 90
days = 84
start = "2026-06-01"

[names]
legal_suffix = 0.55        # "GmbH", "Inc." added or dropped between sources
umlaut_transliteration = 0.35
typo = 0.08
rebrand = 0.04             # renamed company; the old name lingers in one source
www_or_path_domain = 0.25
shared_generic_name = 0.05 # distinct companies with near-identical names ("Nova Robotics")

[vendor]
coverage = 0.82
headcount_noise = 0.18
funding_announce_lag_days = [3, 45]
duplicate_delivery = 0.02
date_is_entry_date = 0.15  # the vendor stores the day it added a round instead of the announcement

[register]
coverage_dach = 0.97
dach_share = 0.45

[news]
mentions_per_relationship = [1, 3]
ambiguous_share = 0.33     # wording that does not name the relationship type
german_share = 0.25
noise_mentions = 0.20      # articles naming both companies without any relationship
unseen_phrasing_share = 0.3  # wording no rule was written against (held-out only)

[jobs]
weekly_noise = 0.25

[events]
funding_rate = 0.12
acquisition_rate = 0.03
shutdown_rate = 0.025

[outages]
# (feed, start day, length in days, kind): stop = no rows, drift = renamed field, volume = 80% fewer rows
plan = [["vendor_profiles", 15, 3, "drift"], ["news_mentions", 33, 5, "stop"], ["register_notices", 52, 3, "volume"], ["job_posts", 60, 21, "stop"]]

[models]
# Simulated LLM behaviour (assumptions, stated in docs/assumptions.md).
cheap_accuracy_clear = 0.93
cheap_accuracy_ambiguous = 0.70
expensive_accuracy_clear = 0.985
expensive_accuracy_ambiguous = 0.88
tokens_per_snippet = [180, 420]
