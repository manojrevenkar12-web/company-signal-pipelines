[project]
name = "company-signal-pipelines"
version = "1.0.0"
description = "Company-data pipelines: idempotent ingestion with monitors, entity resolution, LLM relationship classification with a cost cascade, dated signals, golden records."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dagster>=1.10",
    "anthropic>=0.40",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
signals = "signals.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311", "S608", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S310"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/signals"]
